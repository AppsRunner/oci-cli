# Drop-in Nginx logging configuration for LexBangla.
# Include this file inside the http {} block of your main nginx.conf:
#   include /etc/nginx/conf.d/logging.conf;

# Structured access log format — every field is parseable by Promtail logfmt.
log_format lexbangla_json escape=json
  '{'
    '"time":"$time_iso8601",'
    '"remote_addr":"$remote_addr",'
    '"method":"$request_method",'
    '"uri":"$uri",'
    '"args":"$args",'
    '"status":$status,'
    '"body_bytes_sent":$body_bytes_sent,'
    '"request_time":$request_time,'
    '"upstream_response_time":"$upstream_response_time",'
    '"http_referer":"$http_referer",'
    '"http_user_agent":"$http_user_agent",'
    '"http_x_forwarded_for":"$http_x_forwarded_for",'
    '"request_id":"$request_id"'
  '}';

# Legacy combined format kept for human-readable tailing.
log_format lexbangla_combined
  '$remote_addr - $remote_user [$time_local] '
  '"$request" $status $body_bytes_sent '
  '"$http_referer" "$http_user_agent" $request_time';

# Write both formats; Promtail scrapes the access log file.
access_log /var/log/nginx/access.log    lexbangla_combined buffer=8k flush=5s;
access_log /var/log/nginx/access.json   lexbangla_json     buffer=8k flush=5s;

# Error log — warn level and above (debug is too verbose in prod).
error_log  /var/log/nginx/error.log warn;
