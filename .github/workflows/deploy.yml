name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image tag to deploy (default: latest SHA)"
        required: false
        default: ""

concurrency:
  group: production-deploy
  cancel-in-progress: false  # never cancel an in-flight deploy

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  # ── Build & push images (reuses CI build if on main) ───────────────────────
  build:
    name: Build & Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.meta.outputs.version }}
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/lexbangla-${{ matrix.service }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # ── Deploy to OCI production ─────────────────────────────────────────────────
  deploy:
    name: Deploy to OCI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://${{ secrets.DOMAIN }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tag
        id: tag
        run: |
          if [[ -n "${{ github.event.inputs.image_tag }}" ]]; then
            echo "tag=${{ github.event.inputs.image_tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          fi

      - name: Copy deploy directory to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          source: "deploy/"
          target: /opt/lexbangla/

      - name: Write .env.prod on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          script: |
            cat > /opt/lexbangla/deploy/.env.prod << 'ENVEOF'
            DOMAIN=${{ secrets.DOMAIN }}
            CERTBOT_EMAIL=${{ secrets.CERTBOT_EMAIL }}
            GITHUB_ORG=${{ github.repository_owner }}
            IMAGE_TAG=${{ steps.tag.outputs.tag }}
            DEBUG=False
            SECRET_KEY=${{ secrets.DJANGO_SECRET_KEY }}
            ALLOWED_HOSTS=${{ secrets.DOMAIN }},www.${{ secrets.DOMAIN }}
            DJANGO_SETTINGS_MODULE=lexbangla.settings.production
            POSTGRES_DB=${{ secrets.POSTGRES_DB }}
            POSTGRES_USER=${{ secrets.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            DATABASE_URL=postgresql://${{ secrets.POSTGRES_USER }}:${{ secrets.POSTGRES_PASSWORD }}@db:5432/${{ secrets.POSTGRES_DB }}
            REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
            REDIS_URL=redis://:${{ secrets.REDIS_PASSWORD }}@redis:6379/0
            CELERY_BROKER_URL=redis://:${{ secrets.REDIS_PASSWORD }}@redis:6379/1
            CELERY_RESULT_BACKEND=redis://:${{ secrets.REDIS_PASSWORD }}@redis:6379/2
            EMAIL_HOST=${{ secrets.EMAIL_HOST }}
            EMAIL_PORT=587
            EMAIL_USE_TLS=True
            EMAIL_HOST_USER=${{ secrets.EMAIL_HOST_USER }}
            EMAIL_HOST_PASSWORD=${{ secrets.EMAIL_HOST_PASSWORD }}
            DEFAULT_FROM_EMAIL=noreply@${{ secrets.DOMAIN }}
            CORS_ALLOWED_ORIGINS=https://${{ secrets.DOMAIN }},https://www.${{ secrets.DOMAIN }}
            CSRF_TRUSTED_ORIGINS=https://${{ secrets.DOMAIN }},https://www.${{ secrets.DOMAIN }}
            SECURE_SSL_REDIRECT=True
            SECURE_HSTS_SECONDS=63072000
            SESSION_COOKIE_SECURE=True
            CSRF_COOKIE_SECURE=True
            SENTRY_DSN=${{ secrets.SENTRY_DSN }}
            ENVEOF
            chmod 600 /opt/lexbangla/deploy/.env.prod

      - name: Log in to GHCR on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          script: |
            echo "${{ secrets.GITHUB_TOKEN }}" | \
              docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Run deploy script on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          command_timeout: 15m
          script: |
            chmod +x /opt/lexbangla/deploy/scripts/deploy.sh
            /opt/lexbangla/deploy/scripts/deploy.sh "${{ steps.tag.outputs.tag }}"

      - name: Verify deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          script: |
            chmod +x /opt/lexbangla/deploy/scripts/health-check.sh
            /opt/lexbangla/deploy/scripts/health-check.sh

      - name: Notify on success
        if: success()
        run: |
          echo "::notice title=Deployed::LexBangla ${{ steps.tag.outputs.tag }} is live at https://${{ secrets.DOMAIN }}"

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error title=Deploy Failed::Deployment of ${{ steps.tag.outputs.tag }} failed. Check server logs: journalctl -u lexbangla -n 100"
