name: OWASP ZAP Baseline Scan

on:
  schedule:
    # Nightly at 03:00 UTC against staging
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      target_url:
        description: "Target URL (defaults to staging)"
        required: false
        default: "https://staging.lexbangla.com"

permissions:
  contents: read
  issues: write   # ZAP action opens GitHub Issues for findings

jobs:
  zap-baseline:
    name: ZAP Baseline Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Resolve target URL
        id: url
        run: |
          URL="${{ github.event.inputs.target_url }}"
          if [ -z "$URL" ]; then
            URL="${{ vars.ZAP_STAGING_URL }}"
          fi
          if [ -z "$URL" ]; then
            URL="https://staging.lexbangla.com"
          fi
          echo "target=$URL" >> "$GITHUB_OUTPUT"

      - name: Run ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: ${{ steps.url.outputs.target }}
          rules_file_name: lexbangla/.zap/rules.tsv
          cmd_options: >
            -I
            -j
            -a
          artifact_name: zap-baseline-report
          fail_action: false   # report but don't hard-fail CI until baseline is clean

      - name: Upload ZAP HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-baseline-report
          path: report_html.html
          retention-days: 30
