# Drop this snippet into your main nginx server block.
# It exposes /nginx_status on a separate internal port that the
# nginx-prometheus-exporter scrapes; do NOT expose this to the internet.

server {
    listen 8080;
    server_name _;

    # Restrict access to the exporter container and localhost only
    allow 172.0.0.0/8;   # Docker bridge networks
    allow 127.0.0.1;
    deny  all;

    location /nginx_status {
        stub_status on;
        access_log  off;
    }

    # Health probe used by Docker healthchecks / load balancers
    location /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
