worker_processes auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time';

    access_log /var/log/nginx/access.log main;

    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    gzip               on;
    gzip_types         text/plain text/css application/json application/javascript text/xml;

    # Security headers
    add_header X-Frame-Options           DENY always;
    add_header X-Content-Type-Options    nosniff always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection          "1; mode=block" always;

    upstream django {
        server django:8000;
        keepalive 32;
    }

    # ── Main application server ────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        client_max_body_size 20M;

        # Django application
        location / {
            proxy_pass         http://django;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
            proxy_connect_timeout 60s;
            proxy_read_timeout    120s;
            proxy_send_timeout    60s;
        }

        # Collected static files
        location /static/ {
            alias   /static/;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable";
        }

        # Simple health-check endpoint (no upstream needed)
        location = /health/ {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }
    }

    # ── Metrics server — nginx stub_status for prometheus-exporter ────────────
    # Exposed on port 8080; the nginx-exporter sidecar scrapes this internally.
    # Bind it to a separate port so it is never reachable on port 80.
    server {
        listen 8080;
        server_name _;

        location = /nginx_status {
            stub_status;
            # Allow only Docker internal networks
            allow 172.16.0.0/12;
            allow 10.0.0.0/8;
            allow 192.168.0.0/16;
            allow 127.0.0.1;
            deny  all;
            access_log off;
        }

        # Deny everything else on this port
        location / {
            deny all;
        }
    }
}
