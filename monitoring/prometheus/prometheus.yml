global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s
  external_labels:
    env: production
    project: lexbangla

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093
      timeout: 10s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:

  # Prometheus self-monitoring
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Django application (django-prometheus exposes /metrics on the app port)
  - job_name: django
    metrics_path: /metrics
    static_configs:
      - targets: ["django:8000"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: lexbangla-django

  # Nginx via nginx-prometheus-exporter sidecar
  - job_name: nginx
    static_configs:
      - targets: ["nginx-exporter:9113"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: lexbangla-nginx

  # PostgreSQL via postgres_exporter
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: lexbangla-postgres

  # Host system metrics
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: lexbangla-host

  # Container metrics via cAdvisor
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
    metric_relabel_configs:
      # Keep only lexbangla containers to reduce cardinality
      - source_labels: [container_label_com_docker_compose_project]
        regex: lexbangla
        action: keep
      - source_labels: [name]
        regex: lexbangla-.*
        action: keep
