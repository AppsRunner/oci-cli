groups:
  - name: lexbangla.containers
    interval: 30s
    rules:
      # ── Recording rule — container restart rate ────────────────────────────
      - record: job:container_restart_rate
        expr: |
          sum(increase(kube_pod_container_status_restarts_total[15m]))
            by (container, pod, namespace)

      # ── Alert: any container restarted more than twice in 15 min ──────────
      - alert: ContainerRestarting
        expr: |
          increase(container_start_time_seconds{name!=""}[15m]) > 2
        for: 0m
        labels:
          severity: warning
          team: ops
        annotations:
          summary: "Container {{ $labels.name }} restarted"
          description: >
            Container {{ $labels.name }} has restarted more than twice in the
            last 15 minutes. Check logs: docker logs {{ $labels.name }}

      - alert: ContainerCrashLooping
        expr: |
          increase(container_start_time_seconds{name!=""}[1h]) > 5
        for: 0m
        labels:
          severity: critical
          team: ops
        annotations:
          summary: "Container {{ $labels.name }} is crash-looping"
          description: >
            Container {{ $labels.name }} has restarted more than 5 times in
            the last hour. This indicates a crash loop. Investigate immediately.

      # ── Alert: container memory above 90 % ────────────────────────────────
      - alert: ContainerHighMemory
        expr: |
          (container_memory_working_set_bytes{name!=""}
            / container_spec_memory_limit_bytes{name!=""}) > 0.90
        for: 5m
        labels:
          severity: warning
          team: ops
        annotations:
          summary: "Container {{ $labels.name }} memory usage above 90%"
          description: >
            Container {{ $labels.name }} is using {{ $value | humanizePercentage }}
            of its memory limit. Consider increasing limits or investigating memory leaks.

      # ── Alert: container CPU throttling above 80 % ────────────────────────
      - alert: ContainerCPUThrottling
        expr: |
          sum(increase(container_cpu_cfs_throttled_seconds_total{name!=""}[5m]))
            by (name)
          /
          sum(increase(container_cpu_cfs_periods_total{name!=""}[5m]))
            by (name)
          > 0.80
        for: 5m
        labels:
          severity: warning
          team: ops
        annotations:
          summary: "Container {{ $labels.name }} CPU throttling above 80%"
          description: >
            Container {{ $labels.name }} is being CPU throttled
            {{ $value | humanizePercentage }} of the time.

  - name: lexbangla.database
    interval: 30s
    rules:
      # ── Recording rule — Django DB connection pool usage ──────────────────
      - record: job:django_db_connections_used
        expr: |
          sum(django_db_execute_total) by (vendor, alias)

      # ── Alert: DB query error rate above 1 % ──────────────────────────────
      - alert: DatabaseQueryErrors
        expr: |
          sum(rate(django_db_errors_total[5m])) by (vendor, alias) > 0.01
        for: 2m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "Database query errors on {{ $labels.alias }}"
          description: >
            Database {{ $labels.alias }} ({{ $labels.vendor }}) is experiencing
            {{ $value }} errors/second. Check DB connectivity and query logs.

      # ── Alert: low headroom warning if postgres_exporter is deployed ──────
      - alert: PostgresConnectionsNearLimit
        expr: |
          (pg_stat_activity_count / pg_settings_max_connections) > 0.85
        for: 5m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "PostgreSQL connections near limit"
          description: >
            PostgreSQL is using {{ $value | humanizePercentage }} of
            max_connections. Consider connection pooling (PgBouncer).
