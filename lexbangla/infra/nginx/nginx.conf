# LexBangla — Nginx reverse proxy with performance tuning
# Assumes: Django backend on 127.0.0.1:8000, Next.js on 127.0.0.1:3000
# Place at /etc/nginx/nginx.conf on OCI Compute instance

user  nginx;

# One worker per CPU core; let the OS decide
worker_processes  auto;

# Raise the per-worker file descriptor limit to handle high concurrency
worker_rlimit_nofile  65535;

error_log  /var/log/nginx/error.log  warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;  # Total max = worker_processes × worker_connections
    multi_accept        on;    # Accept all new connections at once
    use                 epoll; # Linux-optimised event model
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ------------------------------------------------------------------ #
    # Logging
    # ------------------------------------------------------------------ #
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'rt=$request_time uct="$upstream_connect_time" '
                      'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log  /var/log/nginx/access.log  main buffer=16k flush=5s;

    # ------------------------------------------------------------------ #
    # Core performance
    # ------------------------------------------------------------------ #
    sendfile            on;
    tcp_nopush          on;   # Batch small packets (works with sendfile)
    tcp_nodelay         on;   # Disable Nagle for kept-alive connections
    keepalive_timeout   65;
    keepalive_requests  1000;
    types_hash_max_size 4096;
    server_tokens       off;

    # ------------------------------------------------------------------ #
    # Gzip compression
    # ------------------------------------------------------------------ #
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   256;
    gzip_buffers      16 8k;
    gzip_http_version 1.1;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/ld+json
        application/xml
        font/woff
        font/woff2
        image/svg+xml
        image/x-icon;

    # ------------------------------------------------------------------ #
    # Proxy cache shared memory zone (1 GB on disk, 10 MB of keys in RAM)
    # ------------------------------------------------------------------ #
    proxy_cache_path  /var/cache/nginx/lexbangla
                      levels=1:2
                      keys_zone=lexbangla_cache:10m
                      max_size=1g
                      inactive=60m
                      use_temp_path=off;

    # ------------------------------------------------------------------ #
    # Upstream backends
    # ------------------------------------------------------------------ #
    upstream django_backend {
        server 127.0.0.1:8000;
        keepalive 32;  # Persistent connections to Django/Gunicorn
    }

    upstream nextjs_frontend {
        server 127.0.0.1:3000;
        keepalive 32;
    }

    # ------------------------------------------------------------------ #
    # HTTP → HTTPS redirect
    # ------------------------------------------------------------------ #
    server {
        listen       80;
        server_name  lexbangla.com www.lexbangla.com;
        return 301   https://$host$request_uri;
    }

    # ------------------------------------------------------------------ #
    # HTTPS — main virtual host
    # ------------------------------------------------------------------ #
    server {
        listen       443 ssl http2;
        server_name  lexbangla.com www.lexbangla.com;

        ssl_certificate     /etc/letsencrypt/live/lexbangla.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/lexbangla.com/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;
        ssl_stapling        on;
        ssl_stapling_verify on;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options           DENY always;
        add_header X-Content-Type-Options    nosniff always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

        client_max_body_size 50m;  # Allow larger document uploads

        # -------------------------------------------------------------- #
        # Static assets served directly by Nginx (Django collectstatic)
        # -------------------------------------------------------------- #
        location /static/ {
            alias /srv/lexbangla/staticfiles/;
            expires       1y;
            add_header    Cache-Control "public, immutable";
            access_log    off;
            gzip_static   on;
        }

        # -------------------------------------------------------------- #
        # User-uploaded media
        # -------------------------------------------------------------- #
        location /media/ {
            alias /srv/lexbangla/media/;
            expires       30d;
            add_header    Cache-Control "public, max-age=2592000";
            access_log    off;
        }

        # -------------------------------------------------------------- #
        # Django API (cached at Nginx layer for GET endpoints)
        # -------------------------------------------------------------- #
        location /api/ {
            proxy_pass         http://django_backend;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            proxy_cache            lexbangla_cache;
            proxy_cache_valid      200 5m;
            proxy_cache_valid      404 1m;
            proxy_cache_use_stale  error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_lock       on;
            proxy_cache_key        "$scheme$request_method$host$request_uri";
            # Only cache GET/HEAD; never cache authenticated requests
            proxy_cache_bypass     $cookie_sessionid $http_authorization;
            proxy_no_cache         $cookie_sessionid $http_authorization;

            add_header X-Cache-Status $upstream_cache_status;
        }

        # Django admin — no cache, no proxy_cache
        location /admin/ {
            proxy_pass         http://django_backend;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_no_cache     1;
            proxy_cache_bypass 1;
        }

        # -------------------------------------------------------------- #
        # Next.js frontend (legal document pages, SSR/ISR handled by Node)
        # -------------------------------------------------------------- #
        location / {
            proxy_pass         http://nextjs_frontend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # ISR pages carry their own Cache-Control from Next.js;
            # honour those headers at this layer.
            proxy_cache            lexbangla_cache;
            proxy_cache_valid      200 5m;
            proxy_cache_use_stale  error timeout updating;
            proxy_cache_key        "$scheme$host$request_uri";
            proxy_cache_bypass     $cookie_sessionid;
            proxy_no_cache         $cookie_sessionid;

            add_header X-Cache-Status $upstream_cache_status;
        }
    }
}
