# LexBangla — PostgreSQL performance tuning
# Based on an OCI VM.Standard.E4.Flex with 4 OCPUs / 16 GB RAM.
# Apply: copy to /etc/postgresql/15/main/postgresql.conf (or pg_data dir)
# then: sudo systemctl restart postgresql

# ========================================================================
# CONNECTIONS
# ========================================================================
# Keep connections low; use PgBouncer in transaction mode in front of PG.
max_connections                = 100     # PgBouncer pool → fewer PG connections

# ========================================================================
# MEMORY  (16 GB RAM system)
# ========================================================================
shared_buffers                 = 4GB     # 25 % of RAM — primary PG cache
effective_cache_size           = 12GB    # 75 % of RAM — hint for query planner
work_mem                       = 32MB    # Per sort/hash op; total = connections × ops × work_mem
                                         # Legal-doc sorts (ORDER BY date, relevance) benefit from headroom
maintenance_work_mem           = 512MB   # VACUUM, CREATE INDEX, ALTER TABLE
temp_buffers                   = 8MB     # Per-session temp table cache

# ========================================================================
# WAL / CHECKPOINTING
# ========================================================================
wal_buffers                    = 64MB    # Saturates at shared_buffers / 32; 64 MB is safe ceiling
checkpoint_completion_target   = 0.9     # Spread checkpoint I/O over 90 % of interval
checkpoint_timeout             = 10min
max_wal_size                   = 4GB
min_wal_size                   = 512MB
wal_compression                = on      # Reduce WAL volume for large text columns (legal documents)

# ========================================================================
# QUERY PLANNER
# ========================================================================
random_page_cost               = 1.1     # OCI Block Volume (NVMe-backed) — treat like SSD
seq_page_cost                  = 1.0
effective_io_concurrency       = 200     # Number of concurrent disk I/Os (NVMe SSDs)
parallel_tuple_cost            = 0.1
parallel_setup_cost            = 1000
max_parallel_workers_per_gather = 2      # 4 OCPUs → allow 2 parallel workers per query
max_parallel_workers            = 4
default_statistics_target      = 200     # More histogram buckets → better selectivity estimates
                                         # Especially useful for text-search columns in legal docs

# ========================================================================
# FULL-TEXT SEARCH (heavy for legal document corpus)
# ========================================================================
# Ensure pg_trgm and unaccent are installed; no knobs needed here —
# tune GIN indexes and tsvector columns at the schema level instead.

# ========================================================================
# BACKGROUND WRITER
# ========================================================================
bgwriter_delay                 = 50ms
bgwriter_lru_maxpages          = 200
bgwriter_lru_multiplier        = 4.0

# ========================================================================
# AUTOVACUUM (high-write tables: audit logs, user sessions)
# ========================================================================
autovacuum                     = on
autovacuum_max_workers         = 3
autovacuum_naptime             = 30s     # Check tables every 30 s
autovacuum_vacuum_cost_delay   = 2ms     # Low delay → faster vacuum on SSDs
autovacuum_vacuum_scale_factor = 0.05    # Vacuum after 5 % of rows change (vs 20 % default)
autovacuum_analyze_scale_factor = 0.025  # Analyze after 2.5 % row change

# ========================================================================
# LOGGING (structured for OCI Logging / Datadog ingestion)
# ========================================================================
log_destination                = 'stderr'
logging_collector              = on
log_directory                  = '/var/log/postgresql'
log_filename                   = 'postgresql-%Y-%m-%d.log'
log_rotation_age               = 1d
log_rotation_size              = 100MB
log_min_duration_statement     = 200ms   # Log slow queries (> 200 ms)
log_checkpoints                = on
log_connections                = off     # Avoid flooding logs via PgBouncer
log_disconnections             = off
log_lock_waits                 = on
log_temp_files                 = 10MB    # Log temp files > 10 MB (indicates missing index)
log_line_prefix                = '%t [%p] %u@%d '
log_timezone                   = 'UTC'

# ========================================================================
# LOCALE / ENCODING  (Bangla text requires UTF-8)
# ========================================================================
client_encoding                = UTF8
lc_messages                    = 'en_US.UTF-8'
lc_monetary                    = 'bn_BD.UTF-8'
lc_numeric                     = 'bn_BD.UTF-8'
lc_time                        = 'bn_BD.UTF-8'
default_text_search_config     = 'pg_catalog.simple'  # 'simple' works across languages
timezone                       = 'Asia/Dhaka'
