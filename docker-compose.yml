services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  scheduler:
    build:
      context: services/scheduler
    environment:
      REDIS_URL: redis://redis:6379/0
      REINGEST_CRON: "0 2 * * *"
      PRIORITY_REINGEST_CRON: "0 */6 * * *"
      FULL_REINDEX_CRON: "0 3 * * 0"
      HEALTH_PORT: "8080"
      WORKER_HEARTBEAT_TTL: "60"
      WORKER_HEALTH_CHECK_INTERVAL: "30"
      MIN_HEALTHY_WORKERS: "1"
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: services/worker
    environment:
      REDIS_URL: redis://redis:6379/0
      HEARTBEAT_INTERVAL: "15"
      HEARTBEAT_TTL: "60"
      TASK_TIMEOUT: "300"
      MAX_RETRIES: "3"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      replicas: 2
