global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    env: production
    app: lexbangla

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # Django application metrics (django-prometheus)
  - job_name: django
    static_configs:
      - targets: [backend:8000]
    metrics_path: /metrics/
    scrape_interval: 15s

  # Celery metrics (via django-prometheus or flower)
  - job_name: celery
    static_configs:
      - targets: [celery:8000]
    metrics_path: /metrics/
    scrape_interval: 30s

  # Nginx
  - job_name: nginx
    static_configs:
      - targets: [nginx-exporter:9113]

  # PostgreSQL
  - job_name: postgres
    static_configs:
      - targets: [postgres-exporter:9187]

  # Redis
  - job_name: redis
    static_configs:
      - targets: [redis-exporter:9121]

  # Docker container metrics
  - job_name: cadvisor
    static_configs:
      - targets: [cadvisor:8080]
    metric_relabel_configs:
      # Keep only lexbangla containers to reduce cardinality
      - source_labels: [container_label_com_docker_compose_project]
        regex: lexbangla.*
        action: keep

  # Host OS metrics
  - job_name: node
    static_configs:
      - targets: [node-exporter:9100]

  # Prometheus self-monitoring
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
