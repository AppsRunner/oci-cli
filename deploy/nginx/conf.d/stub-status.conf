# Internal Nginx stub_status for prometheus nginx-exporter.
# Bound only on the internal Docker network port 8080 — never exposed publicly.
server {
    listen 8080;
    server_name _;
    access_log off;

    location /stub_status {
        stub_status;
        allow 172.0.0.0/8;  # Docker bridge networks
        allow 10.0.0.0/8;
        deny all;
    }

    location / {
        return 444;
    }
}
